[package]
name = "usb-device-history"
version = "0.1.0"
edition = "2024"

[dependencies]
winreg = "0.52"
wmi = "0.13"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
colored = "2.1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_System_EventLog",
    "Win32_Foundation",
    "Win32_System_SystemServices",
]
